name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run against an UNCONSTRAINED resolve. Neither job caches pip and the
  # repo has no lock file, so every run re-resolves the declared ranges against
  # PyPI-as-of-today -- an upstream release can break this repo with zero commits
  # here. Without a schedule that breakage stays invisible until someone happens
  # to push, and the first victim is either an unrelated PR or a production
  # deploy. That is exactly how mcp 2.0.0 (2026-07-28, dropped
  # `mcp.server.fastmcp`) sat undetected for three days -- see PR #195. A nightly
  # turns "ambushes the next contributor" into "an email within 24h".
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily
  # Lets a human re-run the same unconstrained resolve on demand (e.g. right
  # after an upstream release lands) without waiting for the cron.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The resolved set is the only record of WHAT this run actually tested.
      # When a nightly goes red with no commits in between, diffing this against
      # the last green run's output names the culprit in one step.
      - name: Record the resolved dependency set
        run: pip freeze

      - name: Lint
        run: ruff check src tests examples

      - name: Run tests with coverage
        run: pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          PYTHONPATH: .

      - name: Smoke examples
        run: |
          python examples/run_part1_part2.py
          python examples/run_batch.py --output output/ci_batch.csv
        env:
          PYTHONPATH: .

  # Reproduces the PRODUCTION container's import surface. The Fly image builds
  # with `pip install -e ".[web,mcp]"` (see Dockerfile) -- NOT
  # requirements-dev.txt -- so a module on the app's boot chain that
  # hard-imports an optional-extra dependency (bs4 / price-parser / rapidfuzz /
  # python-stdnum / ...) sails through the `test` job above (those deps are
  # present transitively in the dev install) yet crashes prod on boot, with the
  # app never binding 0.0.0.0:8000. That exact failure took production down on
  # 2026-07-16. This job installs ONLY the production extras and imports the app
  # the way uvicorn does, so any such regression fails the PR instead of the
  # deployment.
  prod-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches Dockerfile `FROM python:3.12-slim`

      - name: Install ONLY the production extras (mirrors the Dockerfile)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,mcp]"

      # Same rationale as the test job -- and this is the set that most closely
      # mirrors what the next `flyctl deploy` will bake into the image.
      - name: Record the resolved dependency set
        run: pip freeze

      - name: Import the app the way uvicorn does (must boot without dev/optional extras)
        run: python -c "import webapp.app; print('prod boot import OK')"
        env:
          PYTHONPATH: .
