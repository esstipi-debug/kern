# Lexico es-CL de congelados -- atributos decisivos para homologacion y para
# el cruce contra vedas. Ver
# docs/superpowers/specs/2026-07-24-radiografia-congelados-chile-design.md
#
# REGLA DE ORIGEN (agregada 2026-07-25 tras una corrida real sobre
# puntomarinochile.cl que marco "Ostion Sin Coral Importado" y "Merluza
# importada" como expuestos a veda chilena -- lo cual es falso: la veda
# alcanza al recurso extraido en aguas chilenas, no al producto importado).
#
# Tres estados, nunca dos. El tercero existe porque la mayoria de los
# titulos NO declaran origen, y tratar "no se" como "nacional" inventa una
# exposicion regulatoria que no consta -- exactamente el error que esta
# regla corrige. Un titulo sin origen se reporta como "requiere confirmar
# origen", no como expuesto.
#
#   nacional     -> la veda chilena aplica
#   importado    -> la veda chilena NO aplica, se suprime la bandera
#   no_declarado -> no se afirma nada; se pide confirmacion al cliente

origen:
  # Marcadores de producto extraido en Chile.
  nacional:
    - nacional
    - chileno
    - chilena
    - austral          # merluza austral: pesqueria chilena
    - del norte        # ostion del norte
    - magallanes
    - chiloe
    - patagonia
    - patagonico
    - araucana

  # Marcadores de producto importado.
  importado:
    - importado
    - importada
    - ecuatoriano
    - ecuatoriana
    - ecuador
    - argentino
    - argentina
    - hubbsi           # Merluccius hubbsi: merluza argentina
    - pangasius        # Vietnam
    - tilapia
    - vietnam
    - vietnamita
    - peruano
    - peruana
    - china
    - chino
    # "asiatico" salio de una corrida real: 8 SKUs de Punto Marino lo
    # declaran en el titulo ("Camaron 36/40 Asiatico Crudo pelado") y solo
    # los atrapaba la regla de formato. Un marcador explicito nunca debe
    # depender de una heuristica de respaldo.
    - asiatico
    - asiatica
    - basa
    - kanikama         # surimi, producto elaborado importado

  # Convenciones de formato que implican origen sin nombrarlo.
  #
  # El calibre por conteo-por-libra (16/20, 21/25, 36/40, 71/90, 100/200) es
  # la convencion estadounidense/ecuatoriana con que se vende el camaron de
  # cultivo importado. El camaron nacional (camaron nailon, Heterocarpus
  # reedi) se vende por grado -- "primera", "extra", "segunda" -- nunca por
  # conteo. Verificado en los catalogos de Rapa-Nui y Punto Marino, donde
  # ambas convenciones conviven en el mismo catalogo sin ambiguedad.
  reglas_de_formato:
    - patron: '\d{2,3}\s*/\s*\d{2,3}'
      aplica_a: [camaron, langostino]
      implica: importado
      razon: >
        Calibre por conteo por libra: convencion de camaron de cultivo
        importado. El camaron nailon nacional se vende por grado, no por
        conteo.
    - patron: '\b(primera|extra|segunda)\b'
      aplica_a: [camaron]
      implica: nacional
      razon: >
        Grado comercial del camaron nailon chileno. No se usa para el
        camaron de cultivo importado.

# Especies, con el nombre canonico al que se normalizan las variantes de
# titulo. Es la llave contra config/regulatory/cl_vedas.yaml.
especie:
  camaron:     [camaron, camarones, camaron nailon]
  langostino:  [langostino, langostinos]
  merluza:     [merluza, merluza comun, merluza austral, merluza hubbsi, pescada]
  reineta:     [reineta]
  congrio:     [congrio, congrio dorado, congrio negro, congrio colorado]
  salmon:      [salmon, salmon salar, salar]
  trucha:      [trucha, trucha arcoiris]
  albacora:    [albacora, pez espada]
  atun:        [atun]
  jibia:       [jibia, calamar gigante]
  calamar:     [calamar, calamares, anillas, anillos de calamar]
  pulpo:       [pulpo]
  chorito:     [chorito, choritos, mejillon, choro, choro zapato]
  almeja:      [almeja, almejas]
  ostion:      [ostion, ostiones, ostion del norte]
  macha:       [macha, machas]
  navajuela:   [navajuela, navajuelas]
  loco:        [loco, locos]
  centolla:    [centolla]
  centollon:   [centollon]
  erizo:       [erizo, erizos]
  jaiba:       [jaiba, jaibas]

# Atributos que separan productos que de otro modo colisionan al homologar.
estado:   [crudo, cocido]
proceso:  [pelado, desvenado, con caparazon, con cascara, sin cascara, apanado,
           rebosado, iqf, porcionado, entero, filete, trozos, medallon,
           granel, sin concha, media concha, con coral, sin coral]
