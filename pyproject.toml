[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kern"
version = "2.9.0"
description = "Kern — an agentic supply-chain engine: inventory optimization, pricing and leadership analysis from a plain-language brief, grounded in a knowledge graph of 25 SCM sources."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "esstipi" }]
keywords = ["inventory", "supply-chain", "eoq", "safety-stock", "operations-research"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    # config/event_routing.yaml (F0, PR-4) -- "ruteo como dato": a small,
    # foundational config-parsing dependency the Tower's event routing cannot
    # degrade without (unlike the optional-extra heavy deps below, there is no
    # meaningful fallback for "the routing table failed to parse").
    "PyYAML>=6.0",
    # nosilo-core (private control plane, esstipi-debug/nosilo-core@v0.1.0) is
    # intentionally NOT a hard dependency so `pip install -e .` works without a
    # token (external evaluators / demos). Full install:
    #   pip install -e ".[core]"              # just the core
    #   pip install -e ".[core,web,mcp]"      # prod parity (mirrors Dockerfile)
    # Demo shortcut when core is expected but token is absent:
    #   pip install -e . --no-deps
    # Vendoring alternative: `git subtree add --prefix=nosilo_core ...` -> remove
    # the git URL entirely (see docs/NOSILO_CORE_FALLBACK.md). Pin is to a TAG,
    # never a branch (branch = build that passes Mon fails Tue with no commit).
    # Private repo -> CI needs NOSILO_CORE_TOKEN, see .github/workflows/tests.yml
    # and the core's CONSUMING.md.
]

[project.optional-dependencies]
core = [
    "nosilo-core @ git+https://github.com/esstipi-debug/nosilo-core.git@v0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
llm = [
    "anthropic>=0.39",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    # Optional error tracking; a no-op unless SENTRY_DSN is set at runtime
    # (webapp/observability.py). In the base web install so production has it
    # available to switch on via the secret, without a Dockerfile change.
    "sentry-sdk>=2.0",
]
# Capability-expansion extras (modules degrade gracefully when absent).
dataquality = [
    "rapidfuzz>=3.0",
    "python-stdnum>=1.19",
]
mcdm = [
    "pymcdm>=1.3",
]
forecast = [
    "statsforecast>=2.0,<3",
    "utilsforecast>=0.2",
]
# Capped below 2.0: mcp 2.0.0 (2026-07-28) removed the `mcp.server.fastmcp`
# module that webapp/mcp_server.py builds the mounted /mcp server on, so an
# unpinned `mcp>=1.0` resolves to a release that cannot import. That breaks the
# app at BOOT (webapp/app.py hard-imports webapp.mcp_server), not just in tests.
# Lift this cap only together with a migration of webapp/mcp_server.py off
# mcp.server.fastmcp -- mcp 2.x also swaps in httpx2 / mcp-types / sse-starlette 3.
mcp = [
    "mcp>=1.0,<2",
]
# scm_agent/embeddings.py -- semantic (hybrid) retrieval over the books graph
# for the operator discovery surfaces (KnowledgeBase.search_hybrid, used by
# `query_knowledge.py --search/--bridge`). fastembed is CPU-only (~20 MB) and
# lazily imported, so absence degrades to keyword ranking (see
# embeddings.py::_has_fastembed). Deliberately opt-in and OUT of the prod
# [web,mcp] boot set and out of CI/requirements-dev: building the index embeds
# every books node on first KnowledgeBase init (model download + compute), a
# cost only someone using semantic discovery should pay. NOT wired into the
# client-facing citation path (jobs/*::gated_citations -> citation_gate).
rag = [
    "fastembed>=0.3",
]
# src/state -- pandera schema contracts + a parquet engine for snapshot history.
# Degrades gracefully when absent (see src/state/system_state.py and store.py).
state = [
    "pandera>=0.32",
    "pyarrow>=15",
]
# jobs/scheduler.py + jobs/notify.py -- in-process job scheduling (F0, PR-3).
# APScheduler[sqlalchemy] brings the SQLite-backed SQLAlchemyJobStore the plan
# calls for; httpx is notify()'s webhook client. Both degrade gracefully when
# absent (see jobs/scheduler.py's SchedulerUnavailableError and
# jobs/notify.py's no-op-without-httpx path) -- pin verified 2026-07.
tower = [
    "APScheduler[sqlalchemy]>=3.11.3,<4",
    "httpx>=0.28",
]
# src/pricing_intel/acquire/structured.py + extract.py + normalize.py (PR-11).
# extruct is "semi-dormant" per the plan's own risk note -- structured.py
# isolates it behind an adapter with a hand-rolled ld+json fallback (lxml +
# chompjs for malformed JSON) so a broken extruct never blocks extraction.
# lxml is pinned explicitly even though extruct already pulls it in
# transitively, because the fallback imports it directly. rapidfuzz and
# python-stdnum (match/, a later PR) already live in the dataquality extra --
# not duplicated here.
pricing-intel = [
    "extruct==0.18.0",
    "lxml>=5.0",
    "price-parser>=0.5.1",
    "chompjs>=1.2",
    # jobs/price_intelligence.py's one-shot acquire step (PR-13):
    # src/pricing_intel/acquire/pdp_fetcher.py's live PDP GET. Already pinned
    # in the "tower" extra for notify()'s webhook client -- same version floor,
    # declared here too so `pip install .[pricing-intel]` alone is enough to
    # run the CLI against a live URL without also pulling in APScheduler.
    "httpx>=0.28",
]
# src/pricing_intel/match/probabilistic.py's documented future upgrade path
# (PR-14 spike, plan section 14 risk #4): splink>=4 installs cleanly and its
# DuckDB backend runs real linking predictions on this Windows py3.11 venv
# (splink==4.0.16 + duckdb==1.5.4, verified 2026-07) -- the wheel risk the
# plan flagged did NOT materialize. It is NOT imported by probabilistic.py
# yet: a naive comparison over raw title text mis-ranks a wrong-model
# variant above a correctly-reworded title (Jaro-Winkler is prefix/order
# sensitive; RapidFuzz's token_sort_ratio, this PR's shipped scorer, is
# not) -- see probabilistic.py's module docstring for the full writeup and
# the calibrated, hand-verified fallback that ships instead. rapidfuzz and
# python-stdnum (gtin.py/fuzzy.py, already used) live in the dataquality
# extra -- not duplicated here.
matching = [
    "splink>=4",
]
# src/elasticity_batch.py's per-SKU log-log OLS confidence interval (PR-16).
# Pure Python + numpy/scipy -- no C-toolchain risk (unlike pymc/pytensor,
# which the plan explicitly rejected for this PR -- see elasticity_batch.py's
# module docstring). Verified installs cleanly on this Windows py3.11 venv
# 2026-07 (statsmodels==0.14.6, one transitive dep: patsy==1.0.2). Degrades
# gracefully when absent: fit_sku_elasticity_ci() falls back to an equivalent
# closed-form OLS confidence interval via numpy + the already-core
# scipy.stats.t -- same normal-equations math, same numbers either way.
elasticity = [
    "statsmodels>=0.14",
]
# src/connectors/{shopify,meli}_prices.py's real transport (PR-18, P3
# repricing_multichannel). httpx already pinned by tower/pricing-intel --
# declared here too so `pip install .[repricing]` alone is enough for the
# live path. Deliberately NOT the plan's originally-listed ShopifyAPI/
# python-amazon-sp-api SDKs: both connectors are a thin, transport-agnostic
# httpx-style adapter (the same convention as src/connectors/http_client.py
# -- "hand it any httpx-style transport"), which avoids a heavy per-SDK
# dependency for two REST/GraphQL calls per channel. Odoo's price connector
# needs no new dep at all (stdlib xmlrpc.client, reused verbatim from
# src/connectors/odoo.py). [CRED] -- exercised only when real credentials
# (a live httpx.Client with the shop/seller's own token) are supplied; the
# test suite runs entirely against the InMemory stand-ins below, zero
# network, zero extra install.
repricing = [
    "httpx>=0.28",
]
# jobs/seo_audit.py's real site crawl (S1, PR-22, plan section 8 "Track B --
# SEO"). advertools wraps Scrapy (robots.txt-respecting, rate-limited by
# default) for the crawl itself; pyarrow is the plan's own declared pin for
# this extra (state's parquet engine, already installed transitively via the
# 'state' extra in this repo -- listed here too so `pip install .[seo]`
# alone is enough). Verified installs cleanly on this Windows py3.11 venv
# 2026-07 (advertools==0.18.0, scrapy==2.17.0, twisted==26.4.0 -- no
# C-toolchain/wheel risk). Structured-data extraction reuses the
# pricing-intel extra's extruct adapter (src/pricing_intel/acquire/
# structured.py) rather than duplicating it here -- install both extras
# together (`pip install .[seo,pricing-intel]`) for the full S1 audit;
# jobs/seo_audit.py raises a clear AdvertoolsUnavailableError (not a bare
# ImportError) when this extra is missing. Lighthouse (the plan's third
# named dependency) is a Node CLI binary, not a pip package -- checked via
# shutil.which at RUN time in jobs/seo_audit.py's run_lighthouse_audit,
# never declared here.
seo = [
    "advertools>=0.14",
    "pyarrow>=15",
]
# src/connectors/browser/cdp.py -- the setup agent's real transport: drives the
# user's Chrome over the Chrome DevTools Protocol (websocket) with HTTP target
# discovery. Both are optional-extra deps imported lazily (the module is never
# on the app boot chain, and the whole recipe loop runs offline against
# FakeBrowser with zero network). websockets>=13 is the floor for the
# websockets.asyncio.client API the driver uses; the installed 15.x satisfies
# it. httpx is already pinned by tower/pricing-intel/repricing -- declared here
# too so `pip install .[browser]` alone is enough.
browser = [
    "websockets>=13",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/esstipi-debug/kern"

[tool.setuptools.packages.find]
# Discovery, not a hand-written list. An explicit `packages = [...]` does NOT
# auto-include subpackages, so every new one has to be remembered - and twice it
# was not: twelve src subpackages (src.connectors, src.state, src.verify, ...)
# were silently absent from every built wheel, and nosilo_core.access joined them
# the moment it was added. Nothing caught it because no deployment installs the
# wheel: the Dockerfile and Railway both `pip install -e .` with PYTHONPATH
# pointing at the source tree, so imports resolve from there and the package list
# never gets exercised. That makes this the worst kind of latent bug - free to
# introduce, invisible until the first `pip install .`.
#
# Patterns rather than bare discovery: `webapp`, `scm_agent` and `jobs` are
# deliberately NOT packaged (they are the application, imported off PYTHONPATH by
# uvicorn), and bare discovery would try to sweep them in along with `tests`.
#
# nosilo_core is the domain-agnostic control plane (see nosilo_core/__init__.py);
# packs/ and src/ are the domain packs that depend on it. That direction is
# enforced by tests/test_core_boundary.py and tests/test_pack_boundary.py.
include = ["packs*", "src*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"
# `integracion` marca los tests que necesitan un servicio externo levantado
# (hoy: un Odoo real, ver tests/integracion/). Se excluyen por defecto para que
# la suite siga siendo ejecutable sin infraestructura -- correrlos con
# `pytest -m integracion`. Excluirlos por defecto NO es esconderlos: el fichero
# tests/integracion/README.md dice como levantarlos y la publicacion del addon
# los exige verdes.
markers = [
    "integracion: necesita un servicio externo levantado (Odoo, etc.)",
]
addopts = "-m 'not integracion'"

[tool.coverage.run]
# Debe coincidir con los `--cov=` del paso "Run tests with coverage" en
# .github/workflows/tests.yml. Los dos existen porque miden en momentos
# distintos -- la CI pasa los flags explicitos, un `pytest --cov` local lee esto
# -- y cuando se despegan, el numero que ve el dev deja de ser el que bloquea el
# merge. tests/test_ci_lint_and_coverage_scope.py falla si se desincronizan.
source = ["packs", "src", "scm_agent", "jobs"]
omit = ["src/__init__.py", "packs/__init__.py"]

[tool.coverage.report]
show_missing = true
# Medido el 2026-08-23 sobre el conjunto de arriba, suite completa, cero fallos:
#
#   packs + src                      95.20%   (16216/17033)  <- lo que media antes
#   packs + src + scm_agent + jobs   94.70%   (28130/29703)  <- al ampliarlo
#   idem, sin scm_agent/graph_memory.py       95.20%   (28130/29547)  <- hoy
#
# Ampliar el conjunto a los dos paquetes del agente costaba 0,50 pp, y esos
# 0,50 pp eran UN archivo: scm_agent/graph_memory.py, 156 sentencias al 0%, el
# modulo que PR #186 desconecto y que no importaba nadie. Borrado en la misma
# tanda, asi que el conjunto ancho vuelve al mismo numero que tenia el angosto.
#
# 90, y no 80: 80 era el numero heredado de cuando se median 17.033 sentencias,
# y con la cobertura real arriba de 95 dejaba ~15 pp para regresar en silencio
# antes de que esto cortara. Un piso a 15 pp del valor real no es un piso.
# Queda ~5 pp de margen, que es lo que hace falta para el ruido de abajo.
#
# Lo que sigue sin hacerse es bajarlo para que entre un conjunto mas grande:
# eso es acomodar la prueba al resultado, que es lo contrario de medir.
#
# Ruido a tener en cuenta al comparar con una medicion local: si tenes instalado
# el extra [rag] (fastembed), corren tests que en la CI se saltean, y
# scm_agent/embeddings.py sale mejor aca de lo que va a salir alla.
# requirements-dev.txt lo excluye a proposito.
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E), isort (I)
select = ["E", "F", "I"]
ignore = ["E501"]  # line length handled by line-length above
