# Fly.io app config for the Inventory Planner webapp + read-only MCP server.
#
# This config is now LIVE and verified end-to-end (2026-07-03) against the
# real app below (https://linchpin.fly.dev) - `app` is not a placeholder
# anymore. If you're forking this for your own deploy, app names are globally
# unique on Fly.io, so change it first: `fly apps create <your-app-name>`,
# then edit `app` below to match before `fly deploy`.

app = "linchpin"
primary_region = "iad"          # CHANGE ME if deploying your own copy elsewhere

[build]

[env]
  LINCHPIN_ENV = "production"
  LINCHPIN_LOG_JSON = "1"
  LINCHPIN_MCP_KEYS_PATH = "/data/mcp_keys.sqlite3"
  # Every OTHER durable store defaulted under the app's own `data/` directory,
  # which is /app/data on this image (WORKDIR /app) - the Machine's EPHEMERAL
  # root filesystem, NOT the volume mounted at /data below. So each one was
  # silently wiped on every single deploy:
  #   - events        the Control Tower's event ledger (monitors' output)
  #   - autonomy      the T1/T2/T3 autonomy + approval audit trail
  #   - state         the system-state snapshots the monitors read
  #   - pricing       the price-watch observation ledger + its SKU map
  # For the price ledger that made the recurring price-watch cron pointless
  # past one deploy cycle: it kept re-acquiring a history it could never keep.
  # Each of these stores mkdir(parents=True, exist_ok=True) on its own base, so
  # pointing them at fresh subpaths of the volume needs no migration - and there
  # is nothing to migrate anyway, since the old location never survived a deploy.
  # Nothing here is mounted at /app/data: the image's static sample CSVs
  # (data/sample_demand_portfolio.csv etc.) stay exactly where they are - see
  # the [[mounts]] comment below for why shadowing them crashes the app.
  LINCHPIN_EVENTS_PATH = "/data/events.sqlite3"
  LINCHPIN_AUTONOMY_PATH = "/data/autonomy.sqlite3"
  LINCHPIN_STATE_PATH = "/data/state"
  LINCHPIN_PRICING_LEDGER_PATH = "/data/pricing_intel/ledger"
  LINCHPIN_SKU_MAP_PATH = "/data/pricing_intel/sku_map"
  # Prod hardening defaults: rate limiting ON at 60 req/min (no longer 0/disabled);
  # LINCHPIN_REQUIRE_SECURE stays 0 until POLICY is configured - prod debe poner 1
  # cuando tenga POLICY para fail-closed, pero rate limit ya no es 0 desde el arranque.
  LINCHPIN_RATE_LIMIT = "60"
  LINCHPIN_REQUIRE_SECURE = "0"
  # 2 workers OOM-killed a 512mb VM within ~10-25s of boot (each uvicorn worker
  # loads its own copy of pandas/numpy/scipy + the orchestrator + the L3
  # knowledge graph - not shared across worker processes). Confirmed live: 1
  # worker is stable indefinitely at 512mb. Bump [[vm]] memory below (real,
  # small recurring cost) before raising this back above 1.
  WEB_CONCURRENCY = "1"

# Mounted at /data, NOT /app/data - the app's own `data/` directory (baked into
# the image at build time) ships small static sample CSVs the webapp reads at
# startup (data/sample_demand_portfolio.csv etc.). A Fly Volume mount shadows
# whatever's already on disk at its destination, so mounting it at /app/data
# would hide those files entirely and crash the app (confirmed live: first
# attempt did exactly this, FileNotFoundError on sample_demand_portfolio.csv).
# Persists the MCP key store across redeploys - Fly Machines' root filesystem
# is otherwise ephemeral. Create once:
# `fly volumes create linchpin_data --size 1 --region <primary_region>`
[[mounts]]
  source = "linchpin_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
