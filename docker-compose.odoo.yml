# Odoo 17 desechable para los tests de integracion del addon.
#
#   docker compose -f docker-compose.odoo.yml up -d
#   uv run --no-sync pytest -m integracion
#   docker compose -f docker-compose.odoo.yml down -v
#
# El `-v` del final es importante: borra el volumen, y la proxima corrida
# arranca de una base limpia. Un test de integracion que hereda el estado de la
# corrida anterior deja de ser reproducible sin avisar.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 20

  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      # El addon se monta, no se copia: editarlo y reiniciar el contenedor basta
      # para reprobarlo, sin reconstruir imagen.
      - ./odoo_addon:/mnt/extra-addons:ro
    command: >
      odoo --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
           --database=kern_test --init=base --without-demo=False
           --db_host=db --db_user=odoo --db_password=odoo
