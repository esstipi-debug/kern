    regiones: [XV, I, II, III, IV]
    ambito: "Arica y Parinacota a Coquimbo (ostion del norte)"
    decreto: DEXE202200104
    fuente: https://www.subpesca.cl/portal/normativa/Medidas-de-administracion-y-regimenes-de-acceso/Vedas/
    nota: >
      Ademas, cierre sanitario total de la Bahia de Tongoy por toxina
