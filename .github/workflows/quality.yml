# .github/workflows/quality.yml
#
# NOTA DE ALCANCE: este repo YA tiene `.github/workflows/tests.yml`, que corre
# ruff + pytest + coverage sobre la matriz 3.11/3.12/3.13 y un job `prod-boot`.
# Este workflow NO lo reemplaza: es un gate rapido (~1 min, un solo Python) que
# da feedback de lint/formato/tipos antes de que termine la matriz completa, y
# agrega dos cosas que hoy no existen: `ruff format --check` y un chequeo de
# tipos no bloqueante. Si prefieres no duplicar minutos de CI, quedate solo con
# docker.yml y descarta este archivo.

name: quality

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma PR cancela la corrida anterior: este job existe para
# dar feedback rapido, no para acumular cola.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4"

      # Mismo scope que tests.yml, para que los dos workflows nunca discrepen.
      - name: Ruff check
        run: ruff check nosilo_core packs src tests examples

      # No bloqueante todavia: el repo no fue formateado con ruff format. Cuando
      # corras `ruff format` una vez sobre todo el arbol, quita `|| true`.
      - name: Ruff format (informativo)
        run: ruff format --check nosilo_core packs src tests examples || true

  types:
    name: type check (no bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install mypy

      # Arrancar por el control plane: es donde un error de tipos cuesta caro
      # (writeback, approvals, registry). Ampliar el scope de a un paquete.
      - name: Mypy sobre el control plane
        run: mypy nosilo_core --ignore-missing-imports --no-strict-optional
        env:
          PYTHONPATH: .

  fast-tests:
    name: fast tests (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # El set resuelto es el unico registro de QUE se probo: sin lock file, un
      # release upstream puede poner el repo en rojo sin commits aca.
      - name: Record the resolved dependency set
        run: pip freeze

      - name: Pytest (sin coverage, falla al primer error)
        run: pytest tests/ -q -x --durations=10
        env:
          PYTHONPATH: .
