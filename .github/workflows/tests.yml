name: tests

on:
  push:
    branches: [main]
  # Every PR, whatever it targets -- not just PRs into main. A stacked PR (one
  # whose base is another feature branch, the natural shape for a change split
  # into reviewable pieces) matched no filter here and therefore got NO checks at
  # all: the only signal on it was GitGuardian, and "no red X" looked identical
  # to "tested and green". Retargeting such a PR at main to force a run does not
  # even work -- that emits a `pull_request` event of type `edited`, and the
  # default types are opened/synchronize/reopened -- and it makes the diff
  # cumulative with its parent, which is exactly the review clarity stacking
  # exists to buy.
  #
  # The cost is one matrix run per stacked PR. That is the point: the alternative
  # is merging code whose only green tick came from a manual `workflow_dispatch`
  # someone remembered to fire.
  pull_request:
    branches: ['**']
  # Nightly run against an UNCONSTRAINED resolve. Neither job caches pip and the
  # repo has no lock file, so every run re-resolves the declared ranges against
  # PyPI-as-of-today -- an upstream release can break this repo with zero commits
  # here. Without a schedule that breakage stays invisible until someone happens
  # to push, and the first victim is either an unrelated PR or a production
  # deploy. That is exactly how mcp 2.0.0 (2026-07-28, dropped
  # `mcp.server.fastmcp`) sat undetected for three days -- see PR #195. A nightly
  # turns "ambushes the next contributor" into "an email within 24h".
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily
  # Lets a human re-run the same unconstrained resolve on demand (e.g. right
  # after an upstream release lands) without waiting for the cron.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # El por que y las dos credenciales posibles viven en la action, no aca:
      # este paso estaba duplicado en los dos jobs, y una copia que se queda
      # atras falla en el job que nadie mira.
      #
      # If neither secret is set, skip the action (invoking it with empty
      # inputs is an intentional hard fail). Install without the private git
      # URL and run the no-core gate instead of aborting before pytest -- that
      # was sixteen days of merges with no tests at all.
      - name: Authenticate to the private core
        if: ${{ secrets.NOSILO_CORE_SSH_KEY != '' || secrets.NOSILO_CORE_TOKEN != '' }}
        uses: ./.github/actions/authenticate-core
        with:
          ssh-key: ${{ secrets.NOSILO_CORE_SSH_KEY }}
          token: ${{ secrets.NOSILO_CORE_TOKEN }}

      - name: Install dependencies
        if: ${{ secrets.NOSILO_CORE_SSH_KEY != '' || secrets.NOSILO_CORE_TOKEN != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install dependencies without private core
        if: ${{ secrets.NOSILO_CORE_SSH_KEY == '' && secrets.NOSILO_CORE_TOKEN == '' }}
        run: |
          echo "::warning::NOSILO_CORE_SSH_KEY and NOSILO_CORE_TOKEN are empty. Running the no-core gate (engine + listing). Full suite: docs/DEPLOYMENT.md section 0."
          python -m pip install --upgrade pip
          grep -v 'nosilo-core @' requirements.txt > "$RUNNER_TEMP/requirements.txt"
          sed "s|^-r requirements.txt|-r $RUNNER_TEMP/requirements.txt|" requirements-dev.txt > "$RUNNER_TEMP/requirements-dev.txt"
          pip install -r "$RUNNER_TEMP/requirements-dev.txt"

      # The resolved set is the only record of WHAT this run actually tested.
      # When a nightly goes red with no commits in between, diffing this against
      # the last green run's output names the culprit in one step.
      - name: Record the resolved dependency set
        run: pip freeze

      - name: Lint
        run: ruff check packs src tests examples

      # nosilo-core is no longer measured here: it lives in its own repo with
      # its own coverage gate. Measuring an installed third-party package from
      # this side would report a number neither repo is responsible for -- and
      # would quietly stop gating the code that gates every write.
      - name: Run tests with coverage
        if: ${{ secrets.NOSILO_CORE_SSH_KEY != '' || secrets.NOSILO_CORE_TOKEN != '' }}
        run: pytest tests/ -q --cov=packs --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          PYTHONPATH: .

      - name: Run tests without private core
        if: ${{ secrets.NOSILO_CORE_SSH_KEY == '' && secrets.NOSILO_CORE_TOKEN == '' }}
        run: pytest tests/ -q --cov=packs --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: .
          KERN_CI_NO_CORE: "1"

      - name: Smoke examples
        run: |
          python examples/run_part1_part2.py
          python examples/run_batch.py --output output/ci_batch.csv
        env:
          PYTHONPATH: .

  # Reproduces the PRODUCTION container's import surface. The Fly image builds
  # with `pip install -e ".[web,mcp]"` (see Dockerfile) -- NOT
  # requirements-dev.txt -- so a module on the app's boot chain that
  # hard-imports an optional-extra dependency (bs4 / price-parser / rapidfuzz /
  # python-stdnum / ...) sails through the `test` job above (those deps are
  # present transitively in the dev install) yet crashes prod on boot, with the
  # app never binding 0.0.0.0:8000. That exact failure took production down on
  # 2026-07-16. This job installs ONLY the production extras and imports the app
  # the way uvicorn does, so any such regression fails the PR instead of the
  # deployment.
  prod-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches Dockerfile `FROM python:3.12-slim`

      # pyproject keeps nosilo-core on the optional `[core]` extra. With a
      # credential we install that extra so `import webapp.app` matches a
      # container that resolved the private git URL. Without one we still
      # install `.[web,mcp]` (the Dockerfile extras minus `[core]`) so a
      # missing secret is not reported as a boot-import failure.
      - name: Authenticate to the private core
        if: ${{ secrets.NOSILO_CORE_SSH_KEY != '' || secrets.NOSILO_CORE_TOKEN != '' }}
        uses: ./.github/actions/authenticate-core
        with:
          ssh-key: ${{ secrets.NOSILO_CORE_SSH_KEY }}
          token: ${{ secrets.NOSILO_CORE_TOKEN }}

      - name: Install production extras plus private core
        if: ${{ secrets.NOSILO_CORE_SSH_KEY != '' || secrets.NOSILO_CORE_TOKEN != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[core,web,mcp]"

      - name: Install ONLY the production extras (no private core)
        if: ${{ secrets.NOSILO_CORE_SSH_KEY == '' && secrets.NOSILO_CORE_TOKEN == '' }}
        run: |
          echo "::warning::NOSILO_CORE_* empty; installing .[web,mcp] without nosilo-core. Full boot import needs docs/DEPLOYMENT.md section 0."
          python -m pip install --upgrade pip
          pip install -e ".[web,mcp]"

      # Same rationale as the test job -- and this is the set that most closely
      # mirrors what the next `flyctl deploy` will bake into the image.
      - name: Record the resolved dependency set
        run: pip freeze

      - name: Import the app the way uvicorn does (must boot without dev/optional extras)
        if: ${{ secrets.NOSILO_CORE_SSH_KEY != '' || secrets.NOSILO_CORE_TOKEN != '' }}
        run: python -c "import webapp.app; print('prod boot import OK')"
        env:
          PYTHONPATH: .

      - name: Confirm production extras import without private core
        if: ${{ secrets.NOSILO_CORE_SSH_KEY == '' && secrets.NOSILO_CORE_TOKEN == '' }}
        run: python -c "import fastapi, uvicorn, webapp.offers; print('prod extras OK without nosilo-core')"
        env:
          PYTHONPATH: .
