# Vedas chilenas vigentes -- dataset curado a mano desde los decretos de
# SUBPESCA (normativa publica). NO se raspa sernapesca.cl: su robots.txt
# prohibe a Claude-Web y anthropic-ai. Ver el spec para la matriz completa
# de licencias.
#
# LA DISTINCION QUE MANDA (art. 2 del decreto del loco, leido completo):
#
#   extractiva  -> prohibe "la captura, comercializacion, transporte,
#                  procesamiento, elaboracion y almacenamiento" del recurso
#                  Y DE SUS PRODUCTOS DERIVADOS (arts. 110/119/139 LGPA).
#                  Una conserva, una empanada o un congelado elaborado a
#                  partir de la especie ESTAN dentro del alcance.
#
#   biologica   -> cierra la CAPTURA en una ventana estacional. No prohibe
#                  tener ni vender stock capturado legalmente antes. Su
#                  efecto es de abastecimiento, no de tenencia: define una
#                  ventana de compra anticipada, no un retiro de vitrina.
#
# Por eso `alcanza_derivados` es explicito por fila y no se deduce del tipo
# al vuelo: hace la consecuencia auditable, y deja lugar a una excepcion si
# algun decreto futuro se aparta de la regla general.
#
# AMBITO REGIONAL. `ambito` era texto libre ("Arica y Parinacota a Coquimbo")
# y eso no se puede evaluar: una veda alcanza al recurso extraido en ciertas
# regiones, y ningun titulo de producto declara de que region vino. Ahora
# cada fila lleva `regiones` como lista explicita de codigos, y el
# clasificador aplica la misma disciplina que con origen y variante:
#
#   region declarada en el titulo -> se filtra por ella
#   region sin declarar           -> se reportan TODAS las ventanas que
#                                    apliquen, salvo el caso siguiente
#   cerrada en TODAS las regiones -> la region deja de importar y la fila
#     verificadas simultaneamente    se puede afirmar sin ambiguedad
#
# El ultimo caso es el que hace util el modelo: la macha esta cerrada hoy en
# los tres bloques regionales para los que hay decreto, con tres fechas
# distintas, asi que no saber de donde vino no cambia la conclusion. Ojo:
# "todas las regiones verificadas" no es "todo Chile" -- las regiones sin
# decreto encontrado quedan como desconocidas, nunca como abiertas.
#
# Codigos: XV I II III IV V VI VII XVI VIII IX XIV X XI XII (RM no tiene
# costa y por eso nunca aparece).
#
# `verificado_el` es por fila a proposito. Las vedas biologicas viven en
# decretos viejos que luego se suspenden temporada a temporada con decretos
# cortos; las extractivas se renuevan con un decreto nuevo y numerado. Una
# fila con mas de 90 dias sin verificar debe emitir advertencia antes de
# llegar a un informe de cliente.

vedas:

  - especie: loco
    tipo: extractiva
    alcanza_derivados: true
    prohibe: [captura, comercializacion, transporte, procesamiento, elaboracion, almacenamiento]
    desde: 2026-01-01
    hasta: 2028-12-31
    regiones: [XV, I, II, III, IV, V, VI, VII, XVI, VIII, IX, XIV, X, XI]
    ambito: "Arica y Parinacota a Aysen (excluye Magallanes)"
    decreto: DEXE202600007
    fuente: https://www.subpesca.cl/portal/normativa/Medidas-de-administracion-y-regimenes-de-acceso/Vedas/
    excepcion: >
      AMERB donde el loco es el recurso principal bajo manejo (art. 3). El
      comercializador debe portar documentacion que acredite origen legal
      (arts. 63/65 LGPA). Que la cumpla o no NO es observable desde afuera:
      el informe reporta la obligacion, nunca una infraccion.
    verificado_el: 2026-07-24

